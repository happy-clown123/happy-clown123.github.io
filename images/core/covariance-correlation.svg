<svg role="img" aria-labelledby="title desc" width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
  <title id="title">协方差与相关性</title>
  <desc id="desc">对照不同点云的共同变化方向，区分正相关、负相关以及缺少线性相关的形态。</desc>
  <rect width="680" height="260" fill="#ffffff"/>

  <!-- 面板1：正相关 -->
  <rect x="20" y="30" width="200" height="170" fill="#fafafa" stroke="#ddd"/>
  <line x1="20" y1="200" x2="220" y2="40" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="45" cy="185" r="4" fill="#3b82f6"/>
  <circle cx="70" cy="172" r="4" fill="#3b82f6"/>
  <circle cx="95" cy="150" r="4" fill="#3b82f6"/>
  <circle cx="120" cy="143" r="4" fill="#3b82f6"/>
  <circle cx="145" cy="122" r="4" fill="#3b82f6"/>
  <circle cx="170" cy="108" r="4" fill="#3b82f6"/>
  <circle cx="195" cy="92" r="4" fill="#3b82f6"/>
  <circle cx="210" cy="82" r="4" fill="#3b82f6"/>
  <text x="120" y="222" font-family="Arial" font-size="13" font-weight="700" fill="#222" text-anchor="middle">正相关 ρ≈+1</text>
  <text x="120" y="240" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">X 大 Y 也大</text>

  <!-- 面板2：无关 -->
  <rect x="240" y="30" width="200" height="170" fill="#fafafa" stroke="#ddd"/>
  <line x1="240" y1="115" x2="440" y2="115" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="265" cy="150" r="4" fill="#6b7280"/>
  <circle cx="280" cy="110" r="4" fill="#6b7280"/>
  <circle cx="300" cy="170" r="4" fill="#6b7280"/>
  <circle cx="320" cy="90" r="4" fill="#6b7280"/>
  <circle cx="340" cy="160" r="4" fill="#6b7280"/>
  <circle cx="360" cy="120" r="4" fill="#6b7280"/>
  <circle cx="380" cy="100" r="4" fill="#6b7280"/>
  <circle cx="400" cy="155" r="4" fill="#6b7280"/>
  <circle cx="420" cy="130" r="4" fill="#6b7280"/>
  <circle cx="430" cy="175" r="4" fill="#6b7280"/>
  <text x="340" y="222" font-family="Arial" font-size="13" font-weight="700" fill="#222" text-anchor="middle">无关 ρ≈0</text>
  <text x="340" y="240" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">X 与 Y 无线性关系</text>

  <!-- 面板3：负相关 -->
  <rect x="460" y="30" width="200" height="170" fill="#fafafa" stroke="#ddd"/>
  <line x1="460" y1="55" x2="660" y2="200" stroke="#ef4444" stroke-width="2"/>
  <circle cx="485" cy="95" r="4" fill="#ef4444"/>
  <circle cx="510" cy="110" r="4" fill="#ef4444"/>
  <circle cx="535" cy="128" r="4" fill="#ef4444"/>
  <circle cx="560" cy="135" r="4" fill="#ef4444"/>
  <circle cx="585" cy="152" r="4" fill="#ef4444"/>
  <circle cx="610" cy="165" r="4" fill="#ef4444"/>
  <circle cx="635" cy="178" r="4" fill="#ef4444"/>
  <circle cx="650" cy="188" r="4" fill="#ef4444"/>
  <text x="560" y="222" font-family="Arial" font-size="13" font-weight="700" fill="#222" text-anchor="middle">负相关 ρ≈−1</text>
  <text x="560" y="240" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">X 大 Y 反而小</text>
</svg>
