<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="430" fill="#ffffff"/>
  <text x="340" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a2e">对抗机器学习攻击分类（按攻击者介入阶段）</text>

  <!-- root -->
  <rect x="270" y="50" width="140" height="40" rx="8" fill="#1a1a2e"/>
  <text x="340" y="75" font-size="14" fill="#ffffff" text-anchor="middle">对抗攻击 Adversarial Attacks</text>

  <!-- two branches by phase -->
  <rect x="40" y="120" width="150" height="36" rx="8" fill="#c0392b"/>
  <text x="115" y="143" font-size="13" fill="#ffffff" text-anchor="middle">训练时 Training-time</text>
  <rect x="490" y="120" width="150" height="36" rx="8" fill="#2980b9"/>
  <text x="565" y="143" font-size="13" fill="#ffffff" text-anchor="middle">推理时 Inference-time</text>

  <!-- training-time leaves -->
  <rect x="20" y="190" width="200" height="46" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="120" y="210" font-size="13" font-weight="600" text-anchor="middle" fill="#7b241c">Poisoning 投毒</text>
  <text x="120" y="228" font-size="11" text-anchor="middle" fill="#7b241c">篡改训练数据，模型学坏 / 性能退化</text>

  <rect x="20" y="252" width="200" height="46" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="120" y="272" font-size="13" font-weight="600" text-anchor="middle" fill="#7b241c">Backdoor 后门</text>
  <text x="120" y="290" font-size="11" text-anchor="middle" fill="#7b241c">植入触发器，触发时定向误判</text>

  <rect x="20" y="314" width="200" height="46" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="120" y="334" font-size="13" font-weight="600" text-anchor="middle" fill="#7b241c">供应链投毒 Supply-chain</text>
  <text x="120" y="352" font-size="11" text-anchor="middle" fill="#7b241c">投毒预训练权重 / 第三方数据集</text>

  <!-- inference-time leaves -->
  <rect x="460" y="190" width="200" height="46" rx="8" fill="#eaf2fb" stroke="#2980b9"/>
  <text x="560" y="210" font-size="13" font-weight="600" text-anchor="middle" fill="#1b4f72">Evasion 对抗样本</text>
  <text x="560" y="228" font-size="11" text-anchor="middle" fill="#1b4f72">FGSM/PGD/CW，改输入使错判</text>

  <!-- lifelong leaves -->
  <rect x="460" y="252" width="200" height="46" rx="8" fill="#eaf2fb" stroke="#2980b9"/>
  <text x="560" y="272" font-size="13" font-weight="600" text-anchor="middle" fill="#1b4f72">Extraction 模型窃取</text>
  <text x="560" y="290" font-size="11" text-anchor="middle" fill="#1b4f72">查询 API 训练替代模型</text>

  <rect x="460" y="314" width="200" height="46" rx="8" fill="#eaf2fb" stroke="#2980b9"/>
  <text x="560" y="334" font-size="13" font-weight="600" text-anchor="middle" fill="#1b4f72">Inference 隐私推断</text>
  <text x="560" y="352" font-size="11" text-anchor="middle" fill="#1b4f72">成员推断 / 模型反演</text>

  <!-- connectors -->
  <line x1="340" y1="90" x2="115" y2="120" stroke="#999" stroke-width="1.5"/>
  <line x1="340" y1="90" x2="565" y2="120" stroke="#999" stroke-width="1.5"/>
  <line x1="115" y1="156" x2="120" y2="190" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="115" y1="156" x2="120" y2="252" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="115" y1="156" x2="120" y2="314" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="565" y1="156" x2="560" y2="190" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="565" y1="156" x2="560" y2="252" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="565" y1="156" x2="560" y2="314" stroke="#2980b9" stroke-width="1.5"/>

  <text x="340" y="408" font-size="11" fill="#666" text-anchor="middle">红色 = 攻击者在训练阶段动手（最难防、最危险）｜蓝色 = 攻击者在部署后动手</text>
</svg>
