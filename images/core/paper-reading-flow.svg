<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="240" fill="#ffffff"/>
  <text x="340" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a2e">论文阅读三遍法（Keshav）</text>

  <g font-size="11">
    <rect x="15" y="60" width="200" height="120" rx="8" fill="#eaf2fb" stroke="#2980b9"/>
    <text x="115" y="82" text-anchor="middle" fill="#1b4f72" font-weight="700">第 1 遍 · 扫（5–10 min）</text>
    <text x="115" y="102" text-anchor="middle" fill="#1b4f72">标题/摘要/引言</text>
    <text x="115" y="118" text-anchor="middle" fill="#1b4f72">小标题/结论</text>
    <text x="115" y="134" text-anchor="middle" fill="#1b4f72">扫参考文献</text>
    <text x="115" y="154" text-anchor="middle" fill="#7b241c" font-weight="600">答五 C：</text>
    <text x="115" y="170" text-anchor="middle" fill="#7b241c">类型/上下文/假设/</text>
    <text x="115" y="184" text-anchor="middle" fill="#7b241c">贡献/清晰度</text>

    <rect x="240" y="60" width="200" height="120" rx="8" fill="#fff4e0" stroke="#d68910"/>
    <text x="340" y="82" text-anchor="middle" fill="#7e5109" font-weight="700">第 2 遍 · 读（~1 h）</text>
    <text x="340" y="102" text-anchor="middle" fill="#7e5109">细看图/表/方法</text>
    <text x="340" y="118" text-anchor="middle" fill="#7e5109">忽略证明细节</text>
    <text x="340" y="134" text-anchor="middle" fill="#7e5109">边读边批注</text>
    <text x="340" y="154" text-anchor="middle" fill="#1b5e20" font-weight="600">产出：</text>
    <text x="340" y="170" text-anchor="middle" fill="#1b5e20">能向同行复述</text>
    <text x="340" y="184" text-anchor="middle" fill="#1b5e20">主要实现方式</text>

    <rect x="465" y="60" width="200" height="120" rx="8" fill="#e8f8f5" stroke="#16a085"/>
    <text x="565" y="82" text-anchor="middle" fill="#0e6655" font-weight="700">第 3 遍 · 复现（~5 h）</text>
    <text x="565" y="102" text-anchor="middle" fill="#0e6655">虚拟重实现</text>
    <text x="565" y="118" text-anchor="middle" fill="#0e6655">挑战每个假设</text>
    <text x="565" y="134" text-anchor="middle" fill="#0e6655">想不同呈现</text>
    <text x="565" y="154" text-anchor="middle" fill="#7b241c" font-weight="600">产出：</text>
    <text x="565" y="170" text-anchor="middle" fill="#7b241c">能凭记忆重建结构</text>
    <text x="565" y="184" text-anchor="middle" fill="#7b241c">指隐含假设/局限</text>
  </g>

  <line x1="215" y1="120" x2="238" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="440" y1="120" x2="463" y2="120" stroke="#444" stroke-width="1.5" marker-end="url(#g)"/>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <text x="340" y="218" font-size="10.5" fill="#666" text-anchor="middle">决定要不要继续读、值不值得复现，都在前两遍内判定——别一上来就死磕全文</text>
</svg>
