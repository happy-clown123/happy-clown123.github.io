<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="340" y="28" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a2e">Agent 分层防御（PALADIN 思路，2026 生产级）</text>
  <text x="340" y="48" font-size="11" fill="#666" text-anchor="middle">各层是"乘法"关系：攻击者必须同时突破多层，门槛指数级上升</text>

  <!-- layered stack -->
  <g font-size="12">
    <rect x="90" y="70" width="500" height="32" rx="6" fill="#fadbd8" stroke="#a93226"/>
    <text x="110" y="90" fill="#7b241c">L0 供应链校验：校验 MCP 服务器完整性、pin 工具 schema 哈希</text>

    <rect x="90" y="108" width="500" height="32" rx="6" fill="#fdebd0" stroke="#ca6f1e"/>
    <text x="110" y="128" fill="#7e5109">L1 输入净化：剥离注入标记、校验工具输出再进 prompt</text>

    <rect x="90" y="146" width="500" height="32" rx="6" fill="#fcf3cf" stroke="#b7950b"/>
    <text x="110" y="166" fill="#7d6608">L2 指令层级：System &gt; User &gt; Tool Output，显式信任标注</text>

    <rect x="90" y="184" width="500" height="32" rx="6" fill="#e8f8f5" stroke="#16a085"/>
    <text x="110" y="204" fill="#0e6655">L3 护栏扫描：PromptArmor / Azure Prompt Shield / NeMo Guardrails</text>

    <rect x="90" y="222" width="500" height="32" rx="6" fill="#eaf2fb" stroke="#2980b9"/>
    <text x="110" y="242" fill="#1b4f72">L4 权限隔离：最小权限、写/转/提权需"干净回合"</text>

    <rect x="90" y="260" width="500" height="32" rx="6" fill="#f4ecf7" stroke="#8e44ad"/>
    <text x="110" y="280" fill="#6c3483">L5 人工确认：高影响动作需用户显式批准（HITL）</text>

    <rect x="90" y="298" width="500" height="32" rx="6" fill="#fdedec" stroke="#cb4335"/>
    <text x="110" y="318" fill="#922b21">L6 输出校验：检查外发数据、回溯工具调用链异常</text>
  </g>

  <text x="340" y="350" font-size="10.5" fill="#666" text-anchor="middle">记忆投毒/工具投毒处在 L0/L1/L2 的交界——这是 2025–2026 防御最薄弱、也最该补的环节</text>
</svg>
