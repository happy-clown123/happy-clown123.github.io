<svg role="img" aria-labelledby="title desc" width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Self-Attention 信息汇聚</title>
  <desc id="desc">每个位置产生查询、键和值，图以一个查询位置读取其余位置为例说明打分、归一化和加权汇聚。</desc>
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="300" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#222" text-anchor="middle">Self-Attention：每个 token 看全句再决定自己</text>
  <!-- tokens -->
  <rect x="40" y="120" width="80" height="40" rx="6" fill="#3b82f6"/>
  <text x="80" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle">猫</text>
  <rect x="140" y="120" width="80" height="40" rx="6" fill="#3b82f6"/>
  <text x="180" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle">坐</text>
  <rect x="240" y="120" width="80" height="40" rx="6" fill="#3b82f6"/>
  <text x="280" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle">在</text>
  <rect x="340" y="120" width="80" height="40" rx="6" fill="#3b82f6"/>
  <text x="380" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle">垫子</text>
  <!-- Q K V box -->
  <rect x="450" y="40" width="120" height="40" rx="6" fill="#8b5cf6"/>
  <text x="510" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">Q,K,V 投影</text>
  <line x1="280" y1="120" x2="450" y2="80" stroke="#aaa" stroke-width="1.5"/>
  <text x="370" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555">每个 token 生成 Q K V</text>
  <!-- attention arrows from 垫子(query) to others -->
  <line x1="380" y1="160" x2="440" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="160" x2="280" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="160" x2="180" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="160" x2="80" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <!-- scores -->
  <rect x="40" y="200" width="80" height="30" rx="4" fill="#fee2e2"/>
  <text x="80" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">score 0.1</text>
  <rect x="140" y="200" width="80" height="30" rx="4" fill="#fee2e2"/>
  <text x="180" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">score 0.1</text>
  <rect x="240" y="200" width="80" height="30" rx="4" fill="#fee2e2"/>
  <text x="280" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">score 0.2</text>
  <rect x="340" y="200" width="80" height="30" rx="4" fill="#dcfce7"/>
  <text x="380" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">score 0.6</text>
  <text x="300" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">softmax(分数) 加权求和 V → 新"垫子"向量 = 聚合了"猫坐"上下文</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
