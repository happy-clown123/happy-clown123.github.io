<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="380" fill="#f7f8fa"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#111827">TCP 连接的建立与断开</text>

  <!-- lifelines -->
  <line x1="120" y1="50" x2="120" y2="350" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="560" y1="50" x2="560" y2="350" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="120" y="44" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">客户端</text>
  <text x="560" y="44" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">服务器</text>

  <!-- three-way -->
  <text x="340" y="70" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">① 三次握手（建立连接）</text>
  <line x1="120" y1="92" x2="560" y2="92" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="86" font-size="12" fill="#1f2937" text-anchor="middle">SYN  seq=x</text>
  <line x1="560" y1="118" x2="120" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="112" font-size="12" fill="#1f2937" text-anchor="middle">SYN+ACK  seq=y, ack=x+1</text>
  <line x1="120" y1="144" x2="560" y2="144" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="138" font-size="12" fill="#1f2937" text-anchor="middle">ACK  ack=y+1  → 连接建立</text>

  <!-- four-way -->
  <text x="340" y="190" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">② 四次挥手（断开连接）</text>
  <line x1="120" y1="212" x2="560" y2="212" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="206" font-size="12" fill="#1f2937" text-anchor="middle">FIN  seq=u</text>
  <line x1="560" y1="238" x2="120" y2="238" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="232" font-size="12" fill="#1f2937" text-anchor="middle">ACK  （服务器可能还有数据要发）</text>
  <line x1="560" y1="264" x2="120" y2="264" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="258" font-size="12" fill="#1f2937" text-anchor="middle">FIN  seq=v</text>
  <line x1="120" y1="290" x2="560" y2="290" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="284" font-size="12" fill="#1f2937" text-anchor="middle">ACK  → 客户端进 TIME_WAIT（2MSL）</text>

  <text x="20" y="338" font-size="11" fill="#6b7280">三次握手：确认双方收发能力，防历史重复连接。 四次挥手：服务器可半关闭，故比建立多一步。</text>
  <text x="20" y="356" font-size="11" fill="#6b7280">SYN 泛洪 = 攻击者发大量 SYN 不回 ACK，耗尽服务器半连接队列 → 一种 DDoS。</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
