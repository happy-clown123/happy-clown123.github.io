<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="320" fill="#f7f8fa"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#111827">SQL 注入：字符串拼接如何变成"永远为真"</text>

  <!-- normal -->
  <text x="20" y="58" font-size="13" font-weight="700" fill="#065f46">正常：用户名 = alice</text>
  <rect x="20" y="70" width="640" height="40" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="30" y="95" font-size="12" fill="#064e3b" xml:space="preserve">SELECT * FROM users WHERE username = 'alice' AND password = '***'</text>

  <!-- malicious -->
  <text x="20" y="138" font-size="13" font-weight="700" fill="#991b1b">恶意：用户名 = admin' OR '1'='1</text>
  <rect x="20" y="150" width="640" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="30" y="175" font-size="12" fill="#7f1d1d" xml:space="preserve">SELECT * FROM users WHERE username = 'admin' OR '1'='1' AND password = '***'</text>

  <text x="20" y="218" font-size="12" fill="#374151">问题出在：用户输入被直接拼进 SQL 字符串，单引号 <tspan font-family="monospace">'</tspan> 提前闭合了原字符串，</text>
  <text x="20" y="238" font-size="12" fill="#374151">后面的 <tspan font-family="monospace" fill="#dc2626">OR '1'='1'</tspan> 让 WHERE 条件恒为真 → 绕过密码校验，甚至拖库。</text>

  <rect x="20" y="256" width="640" height="48" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="30" y="278" font-size="12" fill="#1e3a8a" xml:space="preserve">✅ 防御：参数化查询 / 预编译（? 占位符），让输入永远是"数据"不是"代码"：</text>
  <text x="30" y="298" font-size="12" fill="#1e3a8a" xml:space="preserve">cursor.execute("SELECT * FROM users WHERE username=? AND password=?", (user, pw))</text>
</svg>
