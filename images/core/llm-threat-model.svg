<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="340" y="28" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a2e">LLM 应用架构与威胁面（对照 OWASP LLM Top 10）</text>

  <!-- pipeline boxes -->
  <rect x="30" y="70" width="100" height="50" rx="8" fill="#eaf2fb" stroke="#2980b9"/>
  <text x="80" y="92" font-size="12" text-anchor="middle" fill="#1b4f72">用户输入</text>
  <text x="80" y="110" font-size="10" text-anchor="middle" fill="#1b4f72">LLM01 注入</text>

  <rect x="160" y="70" width="100" height="50" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="210" y="92" font-size="12" text-anchor="middle" fill="#7b241c">检索/RAG</text>
  <text x="210" y="110" font-size="10" text-anchor="middle" fill="#7b241c">LLM08 向量</text>

  <rect x="290" y="70" width="100" height="50" rx="8" fill="#fff4e0" stroke="#d68910"/>
  <text x="340" y="92" font-size="12" text-anchor="middle" fill="#7e5109">LLM 本体</text>
  <text x="340" y="110" font-size="10" text-anchor="middle" fill="#7e5109">LLM04 投毒</text>

  <rect x="420" y="70" width="100" height="50" rx="8" fill="#e8f8f5" stroke="#16a085"/>
  <text x="470" y="92" font-size="12" text-anchor="middle" fill="#0e6655">工具/Agent</text>
  <text x="470" y="110" font-size="10" text-anchor="middle" fill="#0e6655">LLM06 越权</text>

  <rect x="550" y="70" width="100" height="50" rx="8" fill="#f4ecf7" stroke="#8e44ad"/>
  <text x="600" y="92" font-size="12" text-anchor="middle" fill="#6c3483">输出</text>
  <text x="600" y="110" font-size="10" text-anchor="middle" fill="#6c3483">LLM02/05</text>

  <!-- arrows -->
  <line x1="130" y1="95" x2="158" y2="95" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="260" y1="95" x2="288" y2="95" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="390" y1="95" x2="418" y2="95" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="520" y1="95" x2="548" y2="95" stroke="#444" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- memory side -->
  <rect x="290" y="170" width="100" height="46" rx="8" fill="#fef9e7" stroke="#b7950b"/>
  <text x="340" y="190" font-size="12" text-anchor="middle" fill="#7d6608">长期记忆</text>
  <text x="340" y="206" font-size="10" text-anchor="middle" fill="#7d6608">记忆投毒</text>
  <line x1="340" y1="120" x2="340" y2="168" stroke="#b7950b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- supply chain bottom -->
  <rect x="30" y="280" width="620" height="46" rx="8" fill="#fadbd8" stroke="#a93226"/>
  <text x="340" y="302" font-size="13" text-anchor="middle" fill="#7b241c">供应链 Supply Chain（LLM03）：基础模型 / 数据集 / 向量库 / MCP 插件 / 依赖库</text>
  <text x="340" y="320" font-size="11" text-anchor="middle" fill="#7b241c">任一环节被投毒或植入后门 → 整条链路受影响（2024–2026 真实攻击面）</text>

  <line x1="80" y1="120" x2="80" y2="278" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="340" y1="216" x2="340" y2="278" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="600" y1="120" x2="600" y2="278" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <text x="340" y="350" font-size="10.5" fill="#666" text-anchor="middle">威胁面不只是"模型"——数据、工具、集成、记忆、供应链都要纳入（OWASP GenAI 项目的核心思想）</text>
</svg>
