<svg role="img" aria-labelledby="title desc" width="680" height="290" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg">
  <title id="title">正则化与拟合曲线示意</title>
  <desc id="desc">对照追随样本噪声的复杂曲线和受到约束的平滑曲线；这是拟合示意，不能代替实际鲁棒性评测。</desc>
  <rect width="680" height="290" fill="#ffffff"/>
  <text x="340" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#222" text-anchor="middle">正则化：把"过拟合的尖刺"压成"平滑的曲线"</text>

  <!-- 面板 A：无正则 → 过拟合 -->
  <text x="175" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">无正则（过拟合）</text>
  <line x1="40" y1="220" x2="320" y2="220" stroke="#888" stroke-width="1.2"/>
  <line x1="40" y1="60"  x2="40"  y2="220" stroke="#888" stroke-width="1.2"/>
  <!-- 数据点 -->
  <circle cx="67"  cy="120" r="3.5" fill="#111"/>
  <circle cx="99"  cy="80"  r="3.5" fill="#111"/>
  <circle cx="135" cy="112" r="3.5" fill="#111"/>
  <circle cx="175" cy="56"  r="3.5" fill="#111"/>
  <circle cx="207" cy="128" r="3.5" fill="#111"/>
  <circle cx="243" cy="72"  r="3.5" fill="#111"/>
  <circle cx="278" cy="136" r="3.5" fill="#111"/>
  <circle cx="297" cy="104" r="3.5" fill="#111"/>
  <!-- 过拟合 wiggly 曲线 -->
  <path d="M 40 150 C 55 200 67 120 67 120 C 80 40 99 80 99 80 C 115 170 135 112 135 112 C 155 10 175 56 175 56 C 195 200 207 128 207 128 C 225 20 243 72 243 72 C 262 190 278 136 278 136 C 290 70 297 104 297 104 L 310 110"
        fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="175" y="244" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">死记每个点 → 输入微扰就预测乱跳</text>

  <!-- 面板 B：有正则 → 平滑 -->
  <text x="500" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">加入 L2 正则（拟合示意）</text>
  <line x1="360" y1="220" x2="640" y2="220" stroke="#888" stroke-width="1.2"/>
  <line x1="360" y1="60"  x2="360" y2="220" stroke="#888" stroke-width="1.2"/>
  <circle cx="387" cy="120" r="3.5" fill="#111"/>
  <circle cx="419" cy="80"  r="3.5" fill="#111"/>
  <circle cx="455" cy="112" r="3.5" fill="#111"/>
  <circle cx="495" cy="56"  r="3.5" fill="#111"/>
  <circle cx="527" cy="128" r="3.5" fill="#111"/>
  <circle cx="563" cy="72"  r="3.5" fill="#111"/>
  <circle cx="598" cy="136" r="3.5" fill="#111"/>
  <circle cx="617" cy="104" r="3.5" fill="#111"/>
  <!-- 平滑曲线 -->
  <path d="M 360 150 C 420 95 460 120 500 95 C 545 68 580 115 617 104"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="500" y="244" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">抓趋势不记噪声 → 微扰下预测稳定</text>

  <text x="340" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#444" text-anchor="middle">正则化限制拟合复杂度；对抗鲁棒性仍需在固定扰动预算下评测</text>
</svg>
