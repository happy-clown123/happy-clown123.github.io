<svg role="img" aria-labelledby="title desc" width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
  <title id="title">概率分布与 KL 散度</title>
  <desc id="desc">对照两个离散概率分布的质量分配，说明用一个分布近似另一个分布时的不匹配。</desc>
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="340" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#222" text-anchor="middle">分布 P vs Q：形状差越大，KL(P‖Q) 越大</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="40" x2="70" y2="250" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="250" x2="630" y2="250" stroke="#888" stroke-width="1.5"/>
  <text x="62" y="46" font-family="Arial" font-size="11" fill="#555" text-anchor="end">1.0</text>
  <text x="62" y="160" font-family="Arial" font-size="11" fill="#555" text-anchor="end">0.5</text>
  <text x="62" y="254" font-family="Arial" font-size="11" fill="#555" text-anchor="end">0</text>
  <line x1="70" y1="160" x2="630" y2="160" stroke="#eee" stroke-width="1"/>

  <!-- 分组 x=0 -->
  <text x="215" y="272" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">x = 0</text>
  <rect x="160" y="160" width="50" height="90" fill="#3b82f6"/>
  <text x="185" y="152" font-family="Arial" font-size="11" fill="#222" text-anchor="middle">0.5</text>
  <rect x="225" y="88" width="50" height="162" fill="#f59e0b"/>
  <text x="250" y="80" font-family="Arial" font-size="11" fill="#222" text-anchor="middle">0.9</text>

  <!-- 分组 x=1 -->
  <text x="495" y="272" font-family="Arial" font-size="12" fill="#333" text-anchor="middle">x = 1</text>
  <rect x="440" y="160" width="50" height="90" fill="#3b82f6"/>
  <text x="465" y="152" font-family="Arial" font-size="11" fill="#222" text-anchor="middle">0.5</text>
  <rect x="505" y="232" width="50" height="18" fill="#f59e0b"/>
  <text x="530" y="224" font-family="Arial" font-size="11" fill="#222" text-anchor="middle">0.1</text>

  <!-- 图例 -->
  <rect x="290" y="44" width="14" height="14" fill="#3b82f6"/>
  <text x="310" y="56" font-family="Arial" font-size="12" fill="#333">P = [0.5, 0.5]</text>
  <rect x="290" y="64" width="14" height="14" fill="#f59e0b"/>
  <text x="310" y="76" font-family="Arial" font-size="12" fill="#333">Q = [0.9, 0.1]</text>

  <text x="340" y="292" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">KL(P‖Q) ≈ 0.511 nats —— Q 在 x=1 处把 0.5 错估成 0.1，被重罚</text>
</svg>
