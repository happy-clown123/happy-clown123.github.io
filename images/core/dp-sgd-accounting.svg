<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">DP-SGD 运算与隐私核算</title>
  <desc id="desc">逐样本梯度经裁剪、求和加噪和平均更新；另一条核算链需要采样、邻接、噪声和步数。仅有裁剪加噪不能给出正式隐私预算。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#426581"/></marker></defs>
  <rect width="1120" height="410" rx="16" fill="#f5f8fc"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17354d">
    <text x="36" y="43" font-size="25" font-weight="bold">DP-SGD：运算正确与隐私核算是两项要求</text>
    <g fill="#e4effa" stroke="#779bb8" stroke-width="1.5">
      <rect x="35" y="85" width="225" height="120" rx="10"/><rect x="305" y="85" width="225" height="120" rx="10"/>
      <rect x="575" y="85" width="225" height="120" rx="10"/><rect x="845" y="85" width="240" height="120" rx="10"/>
    </g>
    <g font-size="20" text-anchor="middle">
      <text x="147" y="119">1. 每条记录求梯度</text><text x="147" y="154">g₁, g₂, …, gL</text><text x="147" y="184" font-size="15">每条梯度覆盖全部参数</text>
      <text x="417" y="119">2. 逐样本裁剪</text><text x="417" y="154">ḡᵢ = gᵢ / max(1, ‖gᵢ‖/C)</text><text x="417" y="184" font-size="15">每条贡献的范数 ≤ C</text>
      <text x="687" y="119">3. 求和后加噪</text><text x="687" y="154">Σ ḡᵢ + N(0, σ²C²I)</text><text x="687" y="184" font-size="15">此处噪声标准差 = σC</text>
      <text x="965" y="119">4. 除以 L，再更新</text><text x="965" y="154">θ ← θ − η · g̃</text><text x="965" y="184" font-size="15">平均后噪声标准差 = σC/L</text>
    </g>
    <g stroke="#426581" stroke-width="2" marker-end="url(#arrow)"><path d="M260 145 H298"/><path d="M530 145 H568"/><path d="M800 145 H838"/></g>
    <rect x="35" y="246" width="1050" height="125" rx="10" fill="#fff3d9" stroke="#d4af65"/>
    <text x="58" y="279" font-size="21" font-weight="bold">独立核算链：采样方式 + 邻接定义 + σ + 步数 + δ → accountant → ε</text>
    <text x="58" y="315" font-size="18">还要明确保护单位（记录/用户）、随机数与多次发布的组合成本。</text>
    <text x="58" y="344" font-size="18">P02 只演示上方运算与经验指标；没有 accountant，不能把示例结果写成 DP 保证。</text>
  </g>
</svg>
