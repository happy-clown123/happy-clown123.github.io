<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="320" fill="#f7f8fa"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#111827">DNS 递归解析流程（以 www.example.com 为例）</text>

  <!-- nodes -->
  <rect x="20" y="120" width="110" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="75" y="142" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">客户端</text>
  <text x="75" y="158" font-size="10" fill="#374151" text-anchor="middle">Stub resolver</text>

  <rect x="185" y="120" width="120" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="245" y="142" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">本地递归解析器</text>
  <text x="245" y="158" font-size="10" fill="#374151" text-anchor="middle">ISP / 8.8.8.8</text>

  <rect x="360" y="40" width="90" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="405" y="66" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">根服务器</text>
  <rect x="360" y="110" width="90" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="405" y="136" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">.com TLD</text>
  <rect x="360" y="180" width="90" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="405" y="206" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">权威服务器</text>

  <rect x="535" y="120" width="120" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="595" y="142" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">最终 IP</text>
  <text x="595" y="158" font-size="10" fill="#374151" text-anchor="middle">93.184.216.34</text>

  <!-- arrows -->
  <line x1="130" y1="143" x2="183" y2="143" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="156" y="136" font-size="10" fill="#6b7280" text-anchor="middle">查询</text>

  <line x1="305" y1="139" x2="358" y2="78" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="305" y1="139" x2="358" y2="131" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="305" y1="139" x2="358" y2="185" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="333" y="115" font-size="10" fill="#6b7280" text-anchor="middle">逐级问</text>

  <line x1="450" y1="61" x2="450" y2="131" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="450" y1="131" x2="450" y2="201" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="462" y="131" font-size="10" fill="#6b7280" text-anchor="middle">返回</text>

  <line x1="450" y1="201" x2="533" y2="143" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <text x="500" y="180" font-size="10" fill="#6b7280" text-anchor="middle">A 记录</text>

  <line x1="305" y1="166" x2="183" y2="150" stroke="#374151" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#ar)"/>
  <text x="245" y="178" font-size="10" fill="#6b7280" text-anchor="middle">解析器回客户端</text>

  <text x="20" y="270" font-size="11" fill="#6b7280">风险点：DNS 默认明文(UDP 53) → 可被劫持/污染（返回假 IP）。缓解：DoH(DNS over HTTPS)、DoT(DNS over TLS)。</text>
  <text x="20" y="290" font-size="11" fill="#6b7280">本地解析器会缓存；TTL 决定缓存时长。劫持缓存 = DNS 污染攻击。</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
