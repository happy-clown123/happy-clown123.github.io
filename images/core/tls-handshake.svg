<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="360" fill="#f7f8fa"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#111827">TLS 1.3 握手（ECDHE，1-RTT）</text>

  <line x1="130" y1="50" x2="130" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="550" y1="50" x2="550" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="130" y="44" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">客户端</text>
  <text x="550" y="44" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">服务器</text>

  <line x1="130" y1="80" x2="550" y2="80" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="74" font-size="12" fill="#1f2937" text-anchor="middle">ClientHello: 版本、密码套件、client_random、key_share(公钥)</text>

  <line x1="550" y1="120" x2="130" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="114" font-size="12" fill="#1f2937" text-anchor="middle">ServerHello + 证书 + CertificateVerify(签名) + Finished</text>
  <text x="340" y="136" font-size="11" fill="#6b7280" text-anchor="middle">服务器此时已能算出会话密钥（它拿到了 client 的 key_share）</text>

  <line x1="130" y1="166" x2="550" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)"/>
  <text x="340" y="160" font-size="12" fill="#1f2937" text-anchor="middle">Finished（用会话密钥加密）</text>

  <!-- session -->
  <rect x="150" y="200" width="380" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="340" y="225" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">会话密钥建立 → 后续全部对称加密(AEAD)通信</text>

  <!-- properties -->
  <text x="20" y="270" font-size="12" fill="#374151">关键性质：</text>
  <text x="20" y="292" font-size="12" fill="#1f2937">• 前向保密：密钥交换用临时 ECDHE，每次会话不同，私钥泄露也不回溯历史流量</text>
  <text x="20" y="312" font-size="12" fill="#1f2937">• 比 TLS 1.2 少一轮往返（1-RTT），且更多握手消息被加密</text>
  <text x="20" y="332" font-size="12" fill="#1f2937">• 0-RTT 会话恢复：重连时首包即可带加密数据（牺牲部分前向保密，慎用于 API）</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
