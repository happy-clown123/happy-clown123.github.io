<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <text x="340" y="28" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a2e">AI 驱动的安全检测流水线（AI-SOC 核心）</text>

  <rect x="20" y="70" width="110" height="56" rx="8" fill="#eaf2fb" stroke="#2980b9"/>
  <text x="75" y="95" font-size="12" text-anchor="middle" fill="#1b4f72">原始遥测</text>
  <text x="75" y="113" font-size="10" text-anchor="middle" fill="#1b4f72">流量/日志/</text>
  <text x="75" y="125" font-size="10" text-anchor="middle" fill="#1b4f72">样本/邮件</text>

  <rect x="160" y="70" width="110" height="56" rx="8" fill="#fff4e0" stroke="#d68910"/>
  <text x="215" y="95" font-size="12" text-anchor="middle" fill="#7e5109">特征工程</text>
  <text x="215" y="113" font-size="10" text-anchor="middle" fill="#7e5109">NetFlow/</text>
  <text x="215" y="125" font-size="10" text-anchor="middle" fill="#7e5109">API序列/嵌入</text>

  <rect x="300" y="70" width="110" height="56" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="355" y="95" font-size="12" text-anchor="middle" fill="#7b241c">ML 模型</text>
  <text x="355" y="113" font-size="10" text-anchor="middle" fill="#7b241c">分类/异常</text>
  <text x="355" y="125" font-size="10" text-anchor="middle" fill="#7b241c">检测</text>

  <rect x="440" y="70" width="110" height="56" rx="8" fill="#e8f8f5" stroke="#16a085"/>
  <text x="495" y="95" font-size="12" text-anchor="middle" fill="#0e6655">告警+分诊</text>
  <text x="495" y="113" font-size="10" text-anchor="middle" fill="#0e6655">copilot</text>
  <text x="495" y="125" font-size="10" text-anchor="middle" fill="#0e6655">摘要</text>

  <rect x="580" y="70" width="90" height="56" rx="8" fill="#f4ecf7" stroke="#8e44ad"/>
  <text x="625" y="95" font-size="12" text-anchor="middle" fill="#6c3483">响应</text>
  <text x="625" y="113" font-size="10" text-anchor="middle" fill="#6c3483">SOAR</text>
  <text x="625" y="125" font-size="10" text-anchor="middle" fill="#6c3483">HITL</text>

  <line x1="130" y1="98" x2="158" y2="98" stroke="#444" stroke-width="1.5" marker-end="url(#c)"/>
  <line x1="270" y1="98" x2="298" y2="98" stroke="#444" stroke-width="1.5" marker-end="url(#c)"/>
  <line x1="410" y1="98" x2="438" y2="98" stroke="#444" stroke-width="1.5" marker-end="url(#c)"/>
  <line x1="550" y1="98" x2="578" y2="98" stroke="#444" stroke-width="1.5" marker-end="url(#c)"/>

  <rect x="160" y="170" width="430" height="70" rx="8" fill="#fdfefe" stroke="#bbb"/>
  <text x="375" y="195" font-size="12" font-weight="600" text-anchor="middle" fill="#1a1a2e">模型类型（按场景选）</text>
  <text x="375" y="218" font-size="11" text-anchor="middle" fill="#444">监督：RF / GBT / SVM（已知攻击签名）</text>
  <text x="375" y="234" font-size="11" text-anchor="middle" fill="#444">无监督：Isolation Forest / Autoencoder（异常偏离基线）</text>

  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <text x="340" y="285" font-size="10.5" fill="#666" text-anchor="middle">LLM 进来后：copilot 做告警摘要、自动生成 Splunk/KQL 查询、推荐处置步骤（2025 Agentic SOC）</text>
</svg>
