<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="250" fill="#ffffff"/>
  <text x="340" y="26" font-size="17" font-weight="700" text-anchor="middle" fill="#1a1a2e">AI 红队流程（红队 ≠ 跑分榜，是系统级对抗）</text>

  <g font-size="11">
    <rect x="15" y="70" width="115" height="60" rx="8" fill="#eaf2fb" stroke="#2980b9"/>
    <text x="72" y="95" text-anchor="middle" fill="#1b4f72" font-weight="600">① 范围</text>
    <text x="72" y="112" text-anchor="middle" fill="#1b4f72">定目标/边界/</text>
    <text x="72" y="126" text-anchor="middle" fill="#1b4f72">危害类别</text>

    <rect x="145" y="70" width="115" height="60" rx="8" fill="#fff4e0" stroke="#d68910"/>
    <text x="202" y="95" text-anchor="middle" fill="#7e5109" font-weight="600">② 侦察</text>
    <text x="202" y="112" text-anchor="middle" fill="#7e5109">摸系统能力/</text>
    <text x="202" y="126" text-anchor="middle" fill="#7e5109">接口/信任边界</text>

    <rect x="275" y="70" width="115" height="60" rx="8" fill="#fdecea" stroke="#c0392b"/>
    <text x="332" y="95" text-anchor="middle" fill="#7b241c" font-weight="600">③ 攻击</text>
    <text x="332" y="112" text-anchor="middle" fill="#7b241c">注入/越狱/</text>
    <text x="332" y="126" text-anchor="middle" fill="#7b241c">多轮/工具滥用</text>

    <rect x="405" y="70" width="115" height="60" rx="8" fill="#e8f8f5" stroke="#16a085"/>
    <text x="462" y="95" text-anchor="middle" fill="#0e6655" font-weight="600">④ 评估</text>
    <text x="462" y="112" text-anchor="middle" fill="#0e6655">打分(ASR)/</text>
    <text x="462" y="126" text-anchor="middle" fill="#0e6655">严重性分级</text>

    <rect x="535" y="70" width="130" height="60" rx="8" fill="#f4ecf7" stroke="#8e44ad"/>
    <text x="600" y="95" text-anchor="middle" fill="#6c3483" font-weight="600">⑤ 报告+修复</text>
    <text x="600" y="112" text-anchor="middle" fill="#6c3483">产出证据/</text>
    <text x="600" y="126" text-anchor="middle" fill="#6c3483">蓝队修复重测</text>
  </g>

  <line x1="130" y1="100" x2="143" y2="100" stroke="#444" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="260" y1="100" x2="273" y2="100" stroke="#444" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="390" y1="100" x2="403" y2="100" stroke="#444" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="520" y1="100" x2="533" y2="100" stroke="#444" stroke-width="1.5" marker-end="url(#f)"/>

  <rect x="15" y="160" width="650" height="58" rx="8" fill="#fdfefe" stroke="#bbb"/>
  <text x="340" y="182" font-size="11.5" text-anchor="middle" fill="#1a1a2e">关键原则（Microsoft 100+ 产品经验）：系统级攻击胜出；自动化扩覆盖；人的因素不可替代；</text>
  <text x="340" y="200" font-size="11.5" text-anchor="middle" fill="#1a1a2e">红队不是 benchmark——它探索未知危害类别，且"安全工作永无止境"</text>

  <defs>
    <marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
</svg>
