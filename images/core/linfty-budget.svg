<svg role="img" aria-labelledby="title desc" width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg">
  <title id="title">L 无穷范数扰动预算</title>
  <desc id="desc">每个坐标只能在原值上下 epsilon 的范围变化，所有坐标约束共同构成扰动可行区域。</desc>
  <rect width="680" height="280" fill="#ffffff"/>
  <text x="340" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#222" text-anchor="middle">L∞ 攻击预算：每个像素最多改 ε（如 8/255 ≈ 0.031）</text>

  <!-- 面板 A：原始像素 -->
  <text x="175" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">原始图像（每行 = 10 个像素亮度）</text>
  <line x1="40" y1="220" x2="320" y2="220" stroke="#888" stroke-width="1.2"/>
  <rect x="40"  y="120" width="22" height="100" fill="#9ca3af"/>
  <rect x="70"  y="96"  width="22" height="124" fill="#9ca3af"/>
  <rect x="100" y="80"  width="22" height="140" fill="#9ca3af"/>
  <rect x="130" y="132" width="22" height="88"  fill="#9ca3af"/>
  <rect x="160" y="104" width="22" height="116" fill="#9ca3af"/>
  <rect x="190" y="72"  width="22" height="148" fill="#9ca3af"/>
  <rect x="220" y="124" width="22" height="96"  fill="#9ca3af"/>
  <rect x="250" y="100" width="22" height="120" fill="#9ca3af"/>
  <rect x="280" y="84"  width="22" height="136" fill="#9ca3af"/>
  <rect x="310" y="118" width="22" height="102" fill="#9ca3af"/>
  <text x="175" y="244" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">亮度的原始值（0~0.6）</text>

  <!-- 面板 B：扰动预算 -->
  <text x="500" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">叠加的扰动 δ（必须满足 |δᵢ| ≤ ε）</text>
  <line x1="370" y1="150" x2="640" y2="150" stroke="#888" stroke-width="1.2"/>
  <!-- ε 带 -->
  <line x1="370" y1="138" x2="640" y2="138" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="370" y1="162" x2="640" y2="162" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="372" y="134" font-family="Arial" font-size="10" fill="#ef4444">+ε</text>
  <text x="372" y="176" font-family="Arial" font-size="10" fill="#ef4444">−ε</text>
  <!-- 扰动红条（全在 ±ε 带内，baseline=150，带=138~162） -->
  <rect x="385" y="142.8" width="18" height="7.2"  fill="#ef4444"/>
  <rect x="415" y="150"   width="18" height="9.6"  fill="#ef4444"/>
  <rect x="445" y="145.2" width="18" height="4.8"  fill="#ef4444"/>
  <rect x="475" y="138"   width="18" height="12"   fill="#ef4444"/>
  <rect x="505" y="150"   width="18" height="7.2"  fill="#ef4444"/>
  <rect x="535" y="147.6" width="18" height="2.4"  fill="#ef4444"/>
  <rect x="565" y="150"   width="18" height="12"   fill="#ef4444"/>
  <rect x="595" y="140.4" width="18" height="9.6"  fill="#ef4444"/>
  <rect x="625" y="150"   width="18" height="4.8"  fill="#ef4444"/>
  <text x="505" y="244" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">红条 = δᵢ，全落在 ±ε 红带内 → 每个像素只改一点点</text>

  <text x="340" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#444" text-anchor="middle">加扰后像素 = 原值 + δᵢ，肉眼几乎看不出差别，但已足以误导模型 → 这就是 FGSM / PGD 的 L∞ 约束</text>
</svg>
