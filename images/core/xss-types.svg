<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="300" fill="#f7f8fa"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#111827">XSS 三类：恶意脚本在哪被执行</text>

  <!-- 反射型 -->
  <rect x="20" y="48" width="200" height="210" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="120" y="70" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">反射型 (Reflected)</text>
  <text x="120" y="96" font-size="11" fill="#7c2d12" text-anchor="middle">1. 攻击者发带 payload 的链接</text>
  <text x="120" y="116" font-size="11" fill="#7c2d12" text-anchor="middle">2. 用户点击 → 请求带 payload</text>
  <text x="120" y="136" font-size="11" fill="#7c2d12" text-anchor="middle">3. 服务器把 payload 原样</text>
  <text x="120" y="152" font-size="11" fill="#7c2d12" text-anchor="middle">   拼进响应 HTML 返回</text>
  <text x="120" y="172" font-size="11" fill="#7c2d12" text-anchor="middle">4. 浏览器执行 → 偷 cookie/</text>
  <text x="120" y="188" font-size="11" fill="#7c2d12" text-anchor="middle">   钓鱼/钓鱼</text>
  <text x="120" y="240" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">不经服务器存储</text>

  <!-- 存储型 -->
  <rect x="240" y="48" width="200" height="210" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="340" y="70" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">存储型 (Stored)</text>
  <text x="340" y="96" font-size="11" fill="#7f1d1d" text-anchor="middle">1. payload 提交到服务器</text>
  <text x="340" y="116" font-size="11" fill="#7f1d1d" text-anchor="middle">   （评论/昵称/资料）</text>
  <text x="340" y="136" font-size="11" fill="#7f1d1d" text-anchor="middle">2. 服务器存进数据库</text>
  <text x="340" y="156" font-size="11" fill="#7f1d1d" text-anchor="middle">3. 其他用户访问页面</text>
  <text x="340" y="172" font-size="11" fill="#7f1d1d" text-anchor="middle">   时从库取出拼进 HTML</text>
  <text x="340" y="192" font-size="11" fill="#7f1d1d" text-anchor="middle">4. 浏览器执行</text>
  <text x="340" y="240" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">持久化、危害最广</text>

  <!-- DOM 型 -->
  <rect x="460" y="48" width="200" height="210" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="560" y="70" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">DOM 型 (DOM-based)</text>
  <text x="560" y="96" font-size="11" fill="#1e40af" text-anchor="middle">1. payload 进 URL (#)</text>
  <text x="560" y="116" font-size="11" fill="#1e40af" text-anchor="middle">2. 页面 JS 读取 location</text>
  <text x="560" y="136" font-size="11" fill="#1e40af" text-anchor="middle">   未过滤就 innerHTML</text>
  <text x="560" y="156" font-size="11" fill="#1e40af" text-anchor="middle">3. 客户端直接执行</text>
  <text x="560" y="176" font-size="11" fill="#1e40af" text-anchor="middle">   响应里看不到 payload</text>
  <text x="560" y="240" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">漏洞在客户端 JS</text>

  <text x="20" y="288" font-size="11" fill="#6b7280">防御共性：输出时 HTML 转义 + 设 CSP + 对 Cookie 加 HttpOnly。AI 安全里间接 prompt injection 常借存储型 XSS 的载体进入上下文。</text>
</svg>
