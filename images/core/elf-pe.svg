<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="300" fill="#f7f8fa"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#111827">ELF（Linux）vs PE（Windows）结构对比</text>

  <!-- ELF -->
  <rect x="20" y="46" width="310" height="234" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="175" y="70" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">ELF（.o / 可执行 / .so）</text>
  <rect x="50" y="84" width="250" height="30" rx="5" fill="#fff" stroke="#10b981"/>
  <text x="175" y="104" font-size="11" fill="#064e3b" text-anchor="middle">ELF Header（标识/入口/节表偏移）</text>
  <rect x="50" y="122" width="250" height="30" rx="5" fill="#fff" stroke="#10b981"/>
  <text x="175" y="142" font-size="11" fill="#064e3b" text-anchor="middle">.text（代码） .rodata（只读）</text>
  <rect x="50" y="160" width="250" height="30" rx="5" fill="#fff" stroke="#10b981"/>
  <text x="175" y="180" font-size="11" fill="#064e3b" text-anchor="middle">.data / .bss（已初始化/未初始化数据）</text>
  <rect x="50" y="198" width="250" height="30" rx="5" fill="#fff" stroke="#10b981"/>
  <text x="175" y="218" font-size="11" fill="#064e3b" text-anchor="middle">.symtab / .dynstr（符号/字符串）</text>
  <rect x="50" y="236" width="250" height="30" rx="5" fill="#fff" stroke="#10b981"/>
  <text x="175" y="256" font-size="11" fill="#064e3b" text-anchor="middle">Section Header Table（节表）</text>

  <!-- PE -->
  <rect x="350" y="46" width="310" height="234" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="505" y="70" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">PE（.exe / .dll）</text>
  <rect x="380" y="84" width="250" height="30" rx="5" fill="#fff" stroke="#2563eb"/>
  <text x="505" y="104" font-size="11" fill="#1e40af" text-anchor="middle">DOS Header（MZ）+ DOS stub</text>
  <rect x="380" y="122" width="250" height="30" rx="5" fill="#fff" stroke="#2563eb"/>
  <text x="505" y="142" font-size="11" fill="#1e40af" text-anchor="middle">PE Header（Signature+File/Optional）</text>
  <rect x="380" y="160" width="250" height="30" rx="5" fill="#fff" stroke="#2563eb"/>
  <text x="505" y="180" font-size="11" fill="#1e40af" text-anchor="middle">.text / .rdata / .data（节）</text>
  <rect x="380" y="198" width="250" height="30" rx="5" fill="#fff" stroke="#2563eb"/>
  <text x="505" y="218" font-size="11" fill="#1e40af" text-anchor="middle">Import Table / Export Table</text>
  <rect x="380" y="236" width="250" height="30" rx="5" fill="#fff" stroke="#2563eb"/>
  <text x="505" y="256" font-size="11" fill="#1e40af" text-anchor="middle">Optional Header: AddressOfEntryPoint</text>

  <text x="20" y="294" font-size="11" fill="#6b7280">共同点：都是"头部 + 代码节 + 数据节 + 表"。最大区别：PE 有 DOS 兼容头与导入/导出表；ELF 用节表+Program Header，入口经 _start 再到 main。</text>
</svg>
