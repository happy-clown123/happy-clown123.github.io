<svg width="600" height="320" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="320" fill="#ffffff"/>
  <text x="300" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#222" text-anchor="middle">前馈网络前向传播 Forward Pass</text>
  <!-- input layer -->
  <circle cx="90" cy="110" r="20" fill="#3b82f6"/>
  <circle cx="90" cy="170" r="20" fill="#3b82f6"/>
  <circle cx="90" cy="230" r="20" fill="#3b82f6"/>
  <text x="90" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">输入 x (3)</text>
  <!-- hidden layer -->
  <circle cx="300" cy="80" r="20" fill="#8b5cf6"/>
  <circle cx="300" cy="140" r="20" fill="#8b5cf6"/>
  <circle cx="300" cy="200" r="20" fill="#8b5cf6"/>
  <circle cx="300" cy="260" r="20" fill="#8b5cf6"/>
  <text x="300" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">隐藏 h = σ(W₁x+b₁) (4)</text>
  <!-- output layer -->
  <circle cx="510" cy="130" r="20" fill="#16a34a"/>
  <circle cx="510" cy="210" r="20" fill="#16a34a"/>
  <text x="510" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">输出 ŷ = σ(W₂h+b₂) (2)</text>
  <!-- edges input->hidden -->
  <line x1="110" y1="110" x2="280" y2="80" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="110" x2="280" y2="140" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="110" x2="280" y2="200" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="110" x2="280" y2="260" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="170" x2="280" y2="80" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="170" x2="280" y2="140" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="170" x2="280" y2="200" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="170" x2="280" y2="260" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="230" x2="280" y2="80" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="230" x2="280" y2="140" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="230" x2="280" y2="200" stroke="#aaa" stroke-width="1"/>
  <line x1="110" y1="230" x2="280" y2="260" stroke="#aaa" stroke-width="1"/>
  <!-- edges hidden->output -->
  <line x1="320" y1="80" x2="490" y2="130" stroke="#aaa" stroke-width="1"/>
  <line x1="320" y1="80" x2="490" y2="210" stroke="#aaa" stroke-width="1"/>
  <line x1="320" y1="140" x2="490" y2="130" stroke="#aaa" stroke-width="1"/>
  <line x1="320" y1="140" x2="490" y2="210" stroke="#aaa" stroke-width="1"/>
  <line x1="320" y1="200" x2="490" y2="130" stroke="#aaa" stroke-width="1"/>
  <line x1="320" y1="200" x2="490" y2="210" stroke="#aaa" stroke-width="1"/>
  <line x1="320" y1="260" x2="490" y2="130" stroke="#aaa" stroke-width="1"/>
  <line x1="320" y1="260" x2="490" y2="210" stroke="#aaa" stroke-width="1"/>
  <text x="300" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8b5cf6">每个连接 = 一个权重 W</text>
  <text x="510" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#16a34a">argmax → 预测类别</text>
</svg>
