<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="300" fill="#f7f8fa"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#111827">逆向分析流程：先静态、后动态</text>

  <line x1="90" y1="70" x2="600" y2="70" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="90" y1="180" x2="600" y2="180" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="20" y="64" font-size="12" font-weight="700" fill="#1d4ed8">静态分析</text>
  <text x="20" y="174" font-size="12" font-weight="700" fill="#1d4ed8">动态分析</text>

  <!-- static flow -->
  <rect x="40" y="86" width="120" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="100" y="108" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">file 识别格式</text>
  <rect x="180" y="86" width="120" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="240" y="108" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">strings 找明文</text>
  <rect x="320" y="86" width="130" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="385" y="108" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">反汇编/反编译</text>
  <rect x="470" y="86" width="130" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="535" y="108" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Ghidra 读逻辑</text>

  <line x1="160" y1="109" x2="178" y2="109" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="300" y1="109" x2="318" y2="109" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="450" y1="109" x2="468" y2="109" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <!-- dynamic flow -->
  <rect x="40" y="196" width="130" height="46" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="105" y="218" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">GDB/pwndbg 调试</text>
  <rect x="190" y="196" width="130" height="46" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="255" y="218" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Frida 运行时 hook</text>
  <rect x="340" y="196" width="130" height="46" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="405" y="218" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">strace/ltrace</text>
  <rect x="490" y="196" width="130" height="46" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="555" y="218" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">沙箱跑行为</text>

  <line x1="170" y1="219" x2="188" y2="219" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="320" y1="219" x2="338" y2="219" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="470" y1="219" x2="488" y2="219" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>

  <text x="20" y="278" font-size="11" fill="#6b7280">原则：先 strings 找明文字符串/密码/flag（很多题直接出），再静态读反编译伪代码，卡住才上动态调试。恶意样本务必在虚拟机/沙箱跑。</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
